		<style>
			:root {
				--gallery-bg: #080808;
				--gallery-accent: #c1121f;
				--gallery-nav-offset-desktop: 84px;
				--gallery-nav-offset-mobile: 84px;
				--gallery-viewport-height: calc(100vh - var(--gallery-nav-offset-desktop));
			}

			body {
				background: var(--gallery-bg);
			}
/* ===== Coming Soon Overlay ===== */


.gallery-coming-soon {
    position: relative;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(120px, 15vh, 170px) 24px 64px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(180deg, rgba(5,5,5,.97), rgba(10,10,10,1));
    z-index: 1;
    text-align: center;
}

.gallery-coming-soon-card {
				display: grid;
				gap: 14px;
				max-width: 560px;
				padding: clamp(28px, 4vw, 44px);
				border: 1px solid rgba(211, 39, 47, 0.84);
				border-radius: 28px;
				background: rgba(255, 255, 255, 0.04);
				backdrop-filter: blur(18px);
				box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
			}

.gallery-coming-soon-badge{
    display:flexbox;
    padding:10px 18px;
    margin-bottom:18px;
    border-radius:999px;
    border: 1px solid rgba(211, 39, 47, 0.84);
    background:rgba(255,255,255,.06);
    font-size:.75rem;
    font-weight:800;
    letter-spacing:.22em;
    text-transform:uppercase;
}

.gallery-coming-soon-title{
    margin:0 0 16px;
    font-family:"Bebas Neue",sans-serif;
    font-size:clamp(3.5rem,10vw,7rem);
    line-height:.9;
    letter-spacing:.08em;
    			}

				.event-meta {
					grid-template-columns: repeat(2, auto);
				}
			

			@media (max-width: 760px) {
				:root {
					--gallery-nav-offset-mobile: 84px;
					--gallery-viewport-height: calc(100dvh - var(--gallery-nav-offset-mobile));
				}

				.gallery-main {
					height: var(--gallery-viewport-height);
					margin-top: var(--gallery-nav-offset-mobile);
				}

				.event-overlay {
					background:
						linear-gradient(180deg, rgba(8, 8, 8, 0.3) 0%, rgba(8, 8, 8, 0.78) 54%, rgba(8, 8, 8, 0.97) 100%),
						radial-gradient(circle at 16% 22%, rgba(193, 18, 31, 0.22), transparent 44%);
				}

				.event-gallery-section,
				.event-gallery-section[data-side="right"] {
					align-items: end;
					justify-items: stretch;
				}

				.event-gallery-section[data-side="right"] .event-content {
					text-align: center;
				}

				.event-content {
					display: flex;
					flex-direction: column;
					gap: 10px;
					padding: 22px 16px 18px;
					max-width: 100%;
					width: calc(100% - 32px);
					margin: 0 auto 94px;
					justify-self: stretch;
					text-align: center;
					min-height: 290px;
					border: 1px solid rgba(255, 255, 255, 0.12);
					border-radius: 14px;
					background: linear-gradient(180deg, rgba(14, 14, 14, 0.56), rgba(8, 8, 8, 0.24));
					box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 14px 30px rgba(0, 0, 0, 0.35);
					backdrop-filter: blur(3px);
				}

				.event-kicker {
					font-size: 0.68rem;
					letter-spacing: 0.16em;
				}

				.event-title {
					font-size: clamp(2.35rem, 12.8vw, 3.8rem);
					line-height: 0.9;
					letter-spacing: 0.04em;
					text-shadow: 0 8px 22px rgba(0, 0, 0, 0.62);
				}

				.event-meta {
					grid-template-columns: repeat(3, minmax(0, 1fr));
					gap: 7px;
					width: 100%;
					margin-top: auto;
				}

				.event-meta li {
					text-align: center;
					padding: 8px 6px;
					font-size: 0.64rem;
					letter-spacing: 0.08em;
					border-color: rgba(255, 255, 255, 0.28);
					background: rgba(8, 8, 8, 0.7);
				}

				.event-cta {
					min-height: 44px;
					padding: 0 16px;
					font-size: 0.74rem;
					width: 100%;
					margin-top: 4px;
					box-shadow: 0 10px 22px rgba(193, 18, 31, 0.26);
				}

				.event-thumbs,
				.event-gallery-section[data-side="right"] .event-thumbs {
					direction: ltr;
					left: 16px;
					right: 16px;
					grid-template-columns: repeat(4, minmax(0, 1fr));
					gap: 7px;
				}

				.event-thumb {
					height: 62px;
					border-radius: 8px;
					border-color: rgba(255, 255, 255, 0.24);
				}
			}
